<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>머니올라 주간 일정표</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#1a56db;--primary-light:#e8f0fe;
  --accent:#f59e0b;--danger:#ef4444;--success:#10b981;
  --gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;
  --gray-300:#d1d5db;--gray-400:#9ca3af;--gray-500:#6b7280;
  --gray-700:#374151;--gray-900:#111827;
  --sat:#3b82f6;--sun:#ef4444;
  --radius:6px;
  --shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
  --shadow-lg:0 4px 16px rgba(0,0,0,.1);
}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--gray-100);color:var(--gray-900);min-height:100vh;font-size:13px;}

/* ── 헤더 ── */
header{background:var(--primary);color:#fff;padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:var(--shadow-lg);}
header h1{font-size:1.05rem;font-weight:700;}
header h1 span{opacity:.7;font-weight:400;font-size:.85rem;margin-left:8px;}
#lastSaved{font-size:.75rem;opacity:.75;}

/* ── 주간 네비 ── */
.week-nav{display:flex;align-items:center;gap:8px;background:#fff;border-bottom:2px solid var(--gray-200);padding:8px 20px;position:sticky;top:56px;z-index:199;}
.week-nav button{background:var(--gray-100);border:1px solid var(--gray-200);border-radius:var(--radius);padding:5px 12px;font-size:.8rem;cursor:pointer;color:var(--gray-700);transition:all .15s;white-space:nowrap;}
.week-nav button:hover{background:var(--primary-light);color:var(--primary);border-color:var(--primary);}
.week-title{font-size:.9rem;font-weight:700;color:var(--gray-700);flex:1;text-align:center;}
.btn-today{background:var(--accent)!important;color:#fff!important;border-color:var(--accent)!important;}

/* ── 메인 ── */
main{padding:16px 20px 80px;max-width:100%;margin:0 auto;}

/* ── 메모 섹션 ── */
.memo-wrap{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 16px;margin-bottom:14px;}
.memo-wrap h3{font-size:.85rem;font-weight:700;color:var(--gray-700);margin-bottom:10px;}
.memo-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.memo-item label{display:block;font-size:.72rem;font-weight:700;color:var(--gray-500);margin-bottom:4px;text-transform:uppercase;}
.memo-item textarea{width:100%;border:1px solid var(--gray-200);border-radius:var(--radius);padding:6px 8px;font-size:.82rem;font-family:inherit;resize:vertical;min-height:56px;background:var(--gray-50);}
.memo-item textarea:focus{outline:none;border-color:var(--primary);background:#fff;}
.memo-footer{display:flex;justify-content:flex-end;margin-top:8px;}
@media(max-width:600px){.memo-grid{grid-template-columns:1fr;}}

/* ── 테이블 래퍼 ── */
.table-wrap{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:auto;}

/* ── 스케줄 테이블 ── */
table{width:100%;border-collapse:collapse;min-width:900px;}
thead th{
  background:var(--primary);color:#fff;
  padding:8px 10px;font-size:.78rem;font-weight:700;
  text-align:center;white-space:nowrap;
  border-right:1px solid rgba(255,255,255,.2);
  position:sticky;top:0;
}
thead th:last-child{border-right:none;}

/* 열 너비 */
col.c-date   {width:110px;}
col.c-slot   {width:72px;}
col.c-guest  {width:130px;}
col.c-prod   {width:90px;}
col.c-edit   {width:90px;}
col.c-upload {width:180px;}
col.c-res    {width:52px;}
col.c-note   {width:160px;}

/* ── 날짜 그룹 행 ── */
tr.day-header td{
  background:var(--gray-50);
  padding:6px 10px;
  font-weight:700;font-size:.82rem;
  border-top:2px solid var(--gray-300);
  border-bottom:1px solid var(--gray-200);
}
tr.day-header.is-today td{background:var(--primary-light);}
tr.day-header.is-sat td{border-left:3px solid var(--sat);}
tr.day-header.is-sun td{border-left:3px solid var(--sun);}
tr.day-header.is-today td .date-text{color:var(--primary);}
tr.day-header.is-sat td .date-text{color:var(--sat);}
tr.day-header.is-sun td .date-text{color:var(--sun);}

.date-badge-row{display:flex;align-items:center;gap:6px;}
.badge{display:inline-block;padding:1px 6px;border-radius:99px;font-size:.65rem;font-weight:700;}
.badge-today{background:var(--primary);color:#fff;}
.badge-holiday{background:#fee2e2;color:#991b1b;}
.badge-past{opacity:.5;}

/* ── 슬롯 행 ── */
tr.slot-row td{
  padding:4px 8px;
  border-bottom:1px solid var(--gray-100);
  vertical-align:middle;
}
tr.slot-row:last-of-type td{border-bottom:2px solid var(--gray-200);}
tr.slot-row.slot-2 td{background:#fafafa;}

/* ── 인풋 공통 ── */
.cell-input{
  width:100%;border:1px solid transparent;border-radius:4px;
  padding:4px 6px;font-size:.8rem;font-family:inherit;
  background:transparent;color:var(--gray-900);
  transition:border-color .15s,background .15s;
}
.cell-input:hover{border-color:var(--gray-300);background:#fff;}
.cell-input:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 2px rgba(26,86,219,.1);}
textarea.cell-input{resize:vertical;min-height:34px;}
select.cell-input{cursor:pointer;}

/* ── 리소스 체크 ── */
.res-check{display:flex;align-items:center;justify-content:center;width:100%;}
.res-check input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary);cursor:pointer;}

/* ── 시간 입력 ── */
input[type=time].cell-input{min-width:80px;}

/* ── 저장 버튼 행 ── */
tr.save-row td{padding:4px 8px 8px;text-align:right;border-bottom:2px solid var(--gray-300);}
.btn-save{background:var(--primary);color:#fff;border:none;border-radius:4px;padding:4px 12px;font-size:.75rem;font-weight:700;cursor:pointer;transition:background .15s;}
.btn-save:hover{background:#1348c8;}
.btn-clear{background:var(--gray-100);color:var(--gray-500);border:1px solid var(--gray-200);border-radius:4px;padding:4px 8px;font-size:.75rem;cursor:pointer;margin-right:6px;}
.btn-clear:hover{background:#fee2e2;color:var(--danger);border-color:var(--danger);}

/* ── 비어있는 날짜 (업로드만 있는 날) ── */
tr.upload-only-row td{padding:4px 8px;border-bottom:1px solid var(--gray-100);color:var(--gray-500);font-size:.8rem;}

/* ── 토스트 ── */
#toast{position:fixed;bottom:20px;right:20px;background:var(--gray-900);color:#fff;padding:9px 16px;border-radius:var(--radius);font-size:.82rem;opacity:0;transform:translateY(10px);transition:opacity .25s,transform .25s;pointer-events:none;z-index:9999;}
#toast.show{opacity:1;transform:translateY(0);}

/* ── 저장 펄스 ── */
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}70%{box-shadow:0 0 0 8px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
.pulsed{animation:pulse .6s ease-out;}
</style>
</head>

      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</main>

/* ════════════════════════════════════
   날짜 유틸
════════════════════════════════════ */
function toKey(d){return d.toISOString().slice(0,10);}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function getMon(d){
  const r=new Date(d);r.setHours(0,0,0,0);
  const day=r.getDay();
  r.setDate(r.getDate()+(day===0?-6:1-day));
  return r;
}
function fmtDate(d){return `${d.getMonth()+1}월 ${d.getDate()}일 (${DAY_KO[d.getDay()]})`;}

/* ════════════════════════════════════
   localStorage
════════════════════════════════════ */
function loadAll(){try{return JSON.parse(localStorage.getItem('mh_sched'))||{};}catch{return {};}}
function saveAll(o){localStorage.setItem('mh_sched',JSON.stringify(o));}
function loadMemos(){try{return JSON.parse(localStorage.getItem('mh_memos'))||{};}catch{return {};}}
function saveMemos(o){localStorage.setItem('mh_memos',JSON.stringify(o));}

/* 날짜의 슬롯 배열 반환 (저장값 우선, 없으면 PRESET, 없으면 빈 2슬롯) */
function getSlots(key){
  const saved=loadAll();
  if(saved[key]) return saved[key];
  if(PRESET[key]) return JSON.parse(JSON.stringify(PRESET[key]));
  return [{time:'',guest:'',prod:'',edit:'',upload:'',res:false,note:''},
          {time:'',guest:'',prod:'',edit:'',upload:'',res:false,note:''}];
}

/* ════════════════════════════════════
   상태
════════════════════════════════════ */
let weekStart = getMon(new Date());

/* ════════════════════════════════════
   셀렉트 옵션 생성
════════════════════════════════════ */
function memberOpts(val){
  return MEMBERS.map(m=>`<option value="${m}"${m===val?' selected':''}>${m||'—'}</option>`).join('');
}

/* ════════════════════════════════════
   렌더링
════════════════════════════════════ */
function render(){
  const today=new Date(); today.setHours(0,0,0,0);
  const mon=weekStart;
  const sun=addDays(mon,6);

  // 주간 타이틀
  document.getElementById('weekTitle').textContent=
    `${mon.getFullYear()}년  ${fmtDate(mon)} ~ ${fmtDate(sun)}`;

  // 메모 로드
  const wk=toKey(mon);
  const memos=loadMemos()[wk]||{yye:'',cgil:'',etc:''};
  document.getElementById('memo-yye').value=memos.yye||'';
  document.getElementById('memo-cgil').value=memos.cgil||'';
  document.getElementById('memo-etc').value=memos.etc||'';

  // 테이블 바디
  const tbody=document.getElementById('tableBody');
  tbody.innerHTML='';

  for(let i=0;i<7;i++){
    const date=addDays(mon,i);
    const dKey=toKey(date);
    const dow=date.getDay();
    const isToday=toKey(date)===toKey(today);
    const isPast=date<today;
    const holiday=HOLIDAYS[dKey];
    const slots=getSlots(dKey);

    // 날짜 헤더 행
    let hdClass='day-header';
    if(isToday) hdClass+=' is-today';
    if(dow===6) hdClass+=' is-sat';
    if(dow===0) hdClass+=' is-sun';
    if(isPast&&!isToday) hdClass+=' badge-past';

    let badges=`<span class="date-text">${fmtDate(date)}</span>`;
    if(isToday) badges+=`<span class="badge badge-today">오늘</span>`;
    if(holiday) badges+=`<span class="badge badge-holiday">${holiday}</span>`;

    tbody.insertAdjacentHTML('beforeend',`
      <tr class="${hdClass}" id="dh-${dKey}">
        <td colspan="8">
          <div class="date-badge-row">${badges}</div>
        </td>
      </tr>
    `);

    // 슬롯 행 (최소 2행 항상 표시)
    const slotCount=Math.max(2,slots.length);
    for(let s=0;s<slotCount;s++){
      const sl=slots[s]||{time:'',guest:'',prod:'',edit:'',upload:'',res:false,note:''};
      tbody.insertAdjacentHTML('beforeend',`
        <tr class="slot-row${s===1?' slot-2':''}" id="slot-${dKey}-${s}">
          <td style="text-align:center;color:var(--gray-400);font-size:.75rem;">${s===0?'1차':'2차'}</td>
          <td><input type="time" class="cell-input" data-key="${dKey}" data-s="${s}" data-f="time" value="${sl.time||''}"></td>
          <td><textarea class="cell-input" data-key="${dKey}" data-s="${s}" data-f="guest" rows="2">${sl.guest||''}</textarea></td>
          <td><select class="cell-input" data-key="${dKey}" data-s="${s}" data-f="prod">${memberOpts(sl.prod||'')}</select></td>
          <td><select class="cell-input" data-key="${dKey}" data-s="${s}" data-f="edit">${memberOpts(sl.edit||'')}</select></td>
          <td><textarea class="cell-input" data-key="${dKey}" data-s="${s}" data-f="upload" rows="2">${sl.upload||''}</textarea></td>
          <td><div class="res-check"><input type="checkbox" data-key="${dKey}" data-s="${s}" data-f="res"${sl.res?' checked':''}></div></td>
          <td><textarea class="cell-input" data-key="${dKey}" data-s="${s}" data-f="note" rows="2">${sl.note||''}</textarea></td>
        </tr>
      `);
    }

    // 저장 버튼 행
    tbody.insertAdjacentHTML('beforeend',`
      <tr class="save-row">
        <td colspan="8">
          <button class="btn-clear" onclick="clearDay('${dKey}')">초기화</button>
          <button class="btn-save" onclick="saveDay('${dKey}')">저장 ✓</button>
        </td>
      </tr>
    `);
  }
}

/* ════════════════════════════════════
   저장
════════════════════════════════════ */
function saveDay(dKey){
  const all=loadAll();
  const slots=[];
  let s=0;
  while(document.getElementById(`slot-${dKey}-${s}`)){
    const row=document.getElementById(`slot-${dKey}-${s}`);
    const get=(f)=>{
      const el=row.querySelector(`[data-f="${f}"]`);
      if(!el) return '';
      if(f==='res') return el.checked;
      return el.value;
    };
    slots.push({time:get('time'),guest:get('guest'),prod:get('prod'),edit:get('edit'),upload:get('upload'),res:get('res'),note:get('note')});
    s++;
  }
  all[dKey]=slots;
  saveAll(all);

  // 펄스
  const hdr=document.getElementById(`dh-${dKey}`);
  if(hdr){hdr.classList.remove('pulsed');void hdr.offsetWidth;hdr.classList.add('pulsed');setTimeout(()=>hdr.classList.remove('pulsed'),700);}
  showToast('✅ 저장되었습니다.');
  updateLastSaved();
}

function clearDay(dKey){
  if(!confirm('이 날의 데이터를 초기화할까요?\n(기존 독스 데이터로 되돌아갑니다)')) return;
  const all=loadAll();
  delete all[dKey];
  saveAll(all);
  render();
  showToast('🗑 초기화 완료');
}

function saveMemo(){
  const wk=toKey(weekStart);
  const all=loadMemos();
  all[wk]={
    yye:document.getElementById('memo-yye').value,
    cgil:document.getElementById('memo-cgil').value,
    etc:document.getElementById('memo-etc').value,
  };
  saveMemos(all);
  showToast('✅ 메모 저장 완료');
  updateLastSaved();
}

/* ════════════════════════════════════
   주간 이동
════════════════════════════════════ */
function changeWeek(dir){
  weekStart=addDays(weekStart,dir*7);
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function goToday(){
  weekStart=getMon(new Date());
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ════════════════════════════════════
   Ctrl+S 전체 저장
════════════════════════════════════ */
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){
    e.preventDefault();
    for(let i=0;i<7;i++) saveDay(toKey(addDays(weekStart,i)));
    saveMemo();
    showToast('✅ 이번 주 전체 저장 (Ctrl+S)');
  }
});

/* ════════════════════════════════════
   토스트 & 마지막 저장
════════════════════════════════════ */
let _tt;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(_tt); _tt=setTimeout(()=>t.classList.remove('show'),2200);
}
function updateLastSaved(){
  const n=new Date();
  document.getElementById('lastSaved').textContent=
    `마지막 저장 ${n.getHours().toString().padStart(2,'0')}:${n.getMinutes().toString().padStart(2,'0')}`;
}

/* ════════════════════════════════════
   초기 실행
════════════════════════════════════ */
render();
</script>
</body>
</html>

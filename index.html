<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>머니올라 주간 일정표</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --p:#1a56db;--pl:#e8f0fe;--acc:#f59e0b;--dan:#ef4444;
  --g0:#fff;--g1:#f9fafb;--g2:#f3f4f6;--g3:#e5e7eb;
  --g4:#d1d5db;--g5:#9ca3af;--g6:#6b7280;--g7:#374151;--g9:#111827;
  --sat:#2563eb;--sun:#dc2626;
  --r:5px;--sh:0 1px 3px rgba(0,0,0,.08);--shl:0 4px 12px rgba(0,0,0,.1);
}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
     background:var(--g2);color:var(--g9);font-size:12px;line-height:1.4;}

/* ── 헤더 ── */
header{background:var(--p);color:#fff;padding:0 16px;height:48px;
       display:flex;align-items:center;justify-content:space-between;
       position:sticky;top:0;z-index:300;box-shadow:var(--shl);}
header h1{font-size:.95rem;font-weight:700;white-space:nowrap;}
header h1 span{opacity:.7;font-weight:400;font-size:.8rem;margin-left:6px;}
#lastSaved{font-size:.7rem;opacity:.75;white-space:nowrap;}

/* ── 주간 네비 ── */
.wnav{display:flex;align-items:center;gap:6px;background:var(--g0);
      border-bottom:2px solid var(--g3);padding:6px 16px;
      position:sticky;top:48px;z-index:299;}
.wnav button{background:var(--g2);border:1px solid var(--g3);border-radius:var(--r);
             padding:4px 10px;font-size:.75rem;cursor:pointer;color:var(--g7);
             transition:all .12s;white-space:nowrap;}
.wnav button:hover{background:var(--pl);color:var(--p);border-color:var(--p);}
.wnav .wtitle{font-size:.82rem;font-weight:700;color:var(--g7);flex:1;text-align:center;}
.btn-today{background:var(--acc)!important;color:#fff!important;border-color:var(--acc)!important;}

/* ── 메인 ── */
main{padding:10px 16px 60px;}

/* ── 메모 ── */
.memo{background:var(--g0);border-radius:var(--r);box-shadow:var(--sh);
      padding:8px 12px;margin-bottom:10px;}
.memo h3{font-size:.78rem;font-weight:700;color:var(--g7);margin-bottom:7px;}
.memo-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.memo-item label{display:block;font-size:.68rem;font-weight:700;color:var(--g6);margin-bottom:3px;}
.memo-item textarea{width:100%;border:1px solid var(--g3);border-radius:var(--r);
                    padding:4px 6px;font-size:.75rem;font-family:inherit;
                    resize:vertical;min-height:40px;background:var(--g1);}
.memo-item textarea:focus{outline:none;border-color:var(--p);background:var(--g0);}
.memo-footer{display:flex;justify-content:flex-end;margin-top:6px;}
@media(max-width:560px){.memo-grid{grid-template-columns:1fr;}}

/* ── 테이블 래퍼 ── */
.twrap{background:var(--g0);border-radius:var(--r);box-shadow:var(--sh);overflow:auto;}

/* ── 스케줄 테이블 ── */
table{width:100%;border-collapse:collapse;min-width:820px;}
thead th{background:var(--p);color:#fff;padding:6px 8px;font-size:.72rem;
         font-weight:700;text-align:center;white-space:nowrap;
         border-right:1px solid rgba(255,255,255,.15);position:sticky;top:0;z-index:10;}
thead th:last-child{border-right:none;}

/* 열 너비 */
col.c-date {width:100px;}
col.c-time {width:76px;}
col.c-guest{width:110px;}
col.c-prod {width:76px;}
col.c-edit {width:76px;}
col.c-up   {width:160px;}
col.c-res  {width:42px;}
col.c-note {width:130px;}
col.c-act  {width:32px;}

/* ── 날짜 헤더 행 ── */
tr.dh td{background:var(--g2);padding:4px 8px;font-weight:700;font-size:.78rem;
         border-top:2px solid var(--g4);border-bottom:1px solid var(--g3);}
tr.dh.is-today td{background:var(--pl);}
tr.dh.is-sat   td{border-left:3px solid var(--sat);}
tr.dh.is-sun   td{border-left:3px solid var(--sun);}
tr.dh.is-today td .dt{color:var(--p);}
tr.dh.is-sat   td .dt{color:var(--sat);}
tr.dh.is-sun   td .dt{color:var(--sun);}
.dbrow{display:flex;align-items:center;gap:5px;}
.bgt{display:inline-block;padding:1px 5px;border-radius:99px;font-size:.6rem;font-weight:700;}
.bgt-today{background:var(--p);color:#fff;}
.bgt-hol  {background:#fee2e2;color:#991b1b;}

/* ── 슬롯 행 ── */
tr.sr td{padding:2px 6px;border-bottom:1px solid var(--g2);vertical-align:middle;}
tr.sr.sr2 td{background:#fafafa;}

/* ── 인풋 공통 ── */
.ci{width:100%;border:1px solid transparent;border-radius:3px;padding:3px 5px;
    font-size:.75rem;font-family:inherit;background:transparent;color:var(--g9);
    transition:border-color .12s,background .12s;}
.ci:hover{border-color:var(--g4);background:var(--g0);}
.ci:focus{outline:none;border-color:var(--p);background:var(--g0);
          box-shadow:0 0 0 2px rgba(26,86,219,.1);}
textarea.ci{resize:vertical;min-height:28px;line-height:1.35;}
select.ci{cursor:pointer;height:28px;}
input[type=time].ci{min-width:70px;height:28px;}

/* ── 리소스 체크 ── */
.rchk{display:flex;align-items:center;justify-content:center;}
.rchk input{width:14px;height:14px;accent-color:var(--p);cursor:pointer;}

/* ── + 버튼 (2차 추가) ── */
.btn-add{background:none;border:1px dashed var(--g4);border-radius:3px;
         color:var(--g5);font-size:.7rem;cursor:pointer;padding:2px 8px;
         transition:all .12s;white-space:nowrap;}
.btn-add:hover{border-color:var(--p);color:var(--p);background:var(--pl);}

/* ── - 버튼 (2차 삭제) ── */
.btn-del{background:none;border:none;color:var(--g5);font-size:.9rem;
         cursor:pointer;padding:0 4px;line-height:1;transition:color .12s;}
.btn-del:hover{color:var(--dan);}

/* ── 날짜 행 하단 (저장/초기화) ── */
tr.sr-foot td{padding:2px 6px 5px;border-bottom:2px solid var(--g3);text-align:right;}
.btn-save{background:var(--p);color:#fff;border:none;border-radius:3px;
          padding:3px 10px;font-size:.7rem;font-weight:700;cursor:pointer;}
.btn-save:hover{background:#1348c8;}
.btn-clr{background:var(--g2);color:var(--g6);border:1px solid var(--g3);
         border-radius:3px;padding:3px 8px;font-size:.7rem;cursor:pointer;margin-right:5px;}
.btn-clr:hover{background:#fee2e2;color:var(--dan);border-color:var(--dan);}

/* ── 토스트 ── */
#toast{position:fixed;bottom:16px;right:16px;background:var(--g9);color:#fff;
       padding:7px 14px;border-radius:var(--r);font-size:.78rem;
       opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;
       pointer-events:none;z-index:9999;}
#toast.show{opacity:1;transform:translateY(0);}

/* ── 저장 펄스 ── */
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.45)}
                 70%{box-shadow:0 0 0 7px rgba(16,185,129,0)}
                 100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
.pulsed{animation:pulse .55s ease-out;}
</style>
</head>

<header>
  <h1>📅 머니올라 근무 & 녹화 일정표 <span>2026</span></h1>
  <div id="lastSaved"></div>
</header>

<div class="wnav">
  <button onclick="changeWeek(-1)">◀ 이전</button>
  <div class="wtitle" id="weekTitle"></div>
  <button onclick="changeWeek(1)">다음 ▶</button>
  <button class="btn-today" onclick="goToday()">오늘</button>
</div>

<main>

      <div class="memo-item"><label>최건일</label>
        <textarea id="m-cgil" placeholder="최건일 근태/특이사항"></textarea></div>
      <div class="memo-item"><label>특이사항</label>
        <textarea id="m-etc" placeholder="기타 특이사항"></textarea></div>
    </div>
    <div class="memo-footer">
      <button class="btn-save" onclick="saveMemo()">메모 저장</button>
    </div>
  </div>

  <!-- 테이블 -->
  <div class="twrap">
    <table>
      <colgroup>
        <col class="c-date"><col class="c-time"><col class="c-guest">
        <col class="c-prod"><col class="c-edit"><col class="c-up">
        <col class="c-res"><col class="c-note"><col class="c-act">
      </colgroup>
      <thead>
        <tr>

          <th>리소스</th><th>특이사항</th><th></th>
        </tr>
      </thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
</main>
<div id="toast"></div>

const toKey=d=>d.toISOString().slice(0,10);

function getMon(d){
  const r=new Date(d);r.setHours(0,0,0,0);
  const day=r.getDay();r.setDate(r.getDate()+(day===0?-6:1-day));return r;
}
const fmt=d=>`${d.getMonth()+1}월 ${d.getDate()}일 (${DAY_KO[d.getDay()]})`;

  loadSched:()=>{try{return JSON.parse(localStorage.getItem('mh2_s'))||{};}catch{return {};}},

  loadMemo:()=>{try{return JSON.parse(localStorage.getItem('mh2_m'))||{};}catch{return {};}},

/* 슬롯 가져오기: 저장값 우선 → PRESET → 빈 1슬롯 */
function getSlots(key){
  const s=LS.loadSched();

  return [{t:'',g:'',p:'',e:'',u:'',r:0,n:''}];
}

  <td><div class="rchk"><input type="checkbox" data-f="r"${sl.r?' checked':''}></div></td>
  <td><textarea class="ci" data-f="n" rows="1">${sl.n||''}</textarea></td>
  <td></td>
</tr>`;
}

/* ════ 렌더 ════ */
function render(){
  const today=new Date();today.setHours(0,0,0,0);
  document.getElementById('weekTitle').textContent=
    `${WS.getFullYear()}년 ${fmt(WS)} ~ ${fmt(addDays(WS,6))}`;

  const wk=toKey(WS);
  const m=LS.loadMemo()[wk]||{};
  document.getElementById('m-yye').value=m.yye||'';
  document.getElementById('m-cgil').value=m.cgil||'';
  document.getElementById('m-etc').value=m.etc||'';

  const tb=document.getElementById('tb');
  tb.innerHTML='';

  for(let i=0;i<7;i++){
    const date=addDays(WS,i);
    const dKey=toKey(date);
    const dow=date.getDay();
    const isToday=toKey(date)===toKey(today);
    const isPast=date<today;
    const hol=HOL[dKey];
    const slots=getSlots(dKey);

    // 날짜 헤더
    let hc='dh';
    if(isToday)hc+=' is-today';
    if(dow===6)hc+=' is-sat';
    if(dow===0)hc+=' is-sun';

    let badges=`<span class="dt"${isPast&&!isToday?' style="opacity:.5"':''}>${fmt(date)}</span>`;
    if(isToday)badges+=` <span class="bgt bgt-today">오늘</span>`;
    if(hol)    badges+=` <span class="bgt bgt-hol">${hol}</span>`;

    tb.insertAdjacentHTML('beforeend',`
      <tr class="${hc}" id="dh-${dKey}">
        <td colspan="9">
          <div class="dbrow">${badges}</div>
        </td>
      </tr>`);

    // 슬롯 행들
    slots.forEach((sl,s)=>{
      tb.insertAdjacentHTML('beforeend', slotHTML(dKey,s,sl,s===slots.length-1));
    });

    // + 버튼 행 (2차 없을 때만 표시)
    tb.insertAdjacentHTML('beforeend',`
      <tr class="sr-foot" id="foot-${dKey}">
        <td colspan="9">
          <button class="btn-clr" onclick="clearDay('${dKey}')">초기화</button>
          <button class="btn-add" id="addbtn-${dKey}" onclick="addSlot('${dKey}')"
            style="${slots.length>=2?'display:none':''}">＋ 2차 녹화 추가</button>
          <button class="btn-save" onclick="saveDay('${dKey}')">저장 ✓</button>
        </td>
      </tr>`);
  }
}

/* ════ 슬롯 추가 ════ */
function addSlot(dKey){
  // 현재 저장된(또는 PRESET) 슬롯 읽기
  const slots=collectSlots(dKey);
  if(slots.length>=2) return;
  const newSl={t:'',g:'',p:'',e:'',u:'',r:0,n:''};
  // 풋 행 앞에 새 행 삽입
  const foot=document.getElementById(`foot-${dKey}`);
  const tmp=document.createElement('tbody');
  tmp.innerHTML=slotHTML(dKey,1,newSl,true);
  foot.parentNode.insertBefore(tmp.firstElementChild,foot);
  // + 버튼 숨김
  document.getElementById(`addbtn-${dKey}`).style.display='none';
}

/* ════ 슬롯 삭제 ════ */
function delSlot(dKey,s){
  const row=document.getElementById(`sr-${dKey}-${s}`);
  if(row) row.remove();
  const addbtn=document.getElementById(`addbtn-${dKey}`);
  if(addbtn) addbtn.style.display='';
}

/* ════ 슬롯 수집 ════ */
function collectSlots(dKey){
  const slots=[];
  let s=0;
  while(document.getElementById(`sr-${dKey}-${s}`)){
    const row=document.getElementById(`sr-${dKey}-${s}`);
    const gv=f=>{
      const el=row.querySelector(`[data-f="${f}"]`);
      if(!el) return f==='r'?0:'';
      return f==='r'?(el.checked?1:0):el.value;
    };
    slots.push({t:gv('t'),g:gv('g'),p:gv('p'),e:gv('e'),u:gv('u'),r:gv('r'),n:gv('n')});
    s++;
  }
  return slots;
}

/* ════ 저장 ════ */
function saveDay(dKey){
  const all=LS.loadSched();
  all[dKey]=collectSlots(dKey);
  LS.saveSched(all);
  const hdr=document.getElementById(`dh-${dKey}`);
  if(hdr){hdr.classList.remove('pulsed');void hdr.offsetWidth;hdr.classList.add('pulsed');
          setTimeout(()=>hdr.classList.remove('pulsed'),600);}
  toast('✅ 저장되었습니다.');
  updSaved();
}

function clearDay(dKey){
  if(!confirm('이 날의 데이터를 초기화할까요?\n(DOCS 원본으로 복원됩니다)')) return;
  const all=LS.loadSched();
  delete all[dKey];
  LS.saveSched(all);
  render();
  toast('🗑 초기화 완료 (원본 복원)');
}

function saveMemo(){
  const wk=toKey(WS);
  const all=LS.loadMemo();
  all[wk]={yye:document.getElementById('m-yye').value,
           cgil:document.getElementById('m-cgil').value,
           etc:document.getElementById('m-etc').value};
  LS.saveMemo(all);
  toast('✅ 메모 저장 완료');
  updSaved();
}

/* ════ 주간 이동 ════ */
function changeWeek(d){WS=addDays(WS,d*7);render();scrollTo({top:0,behavior:'smooth'});}
function goToday(){WS=getMon(new Date());render();scrollTo({top:0,behavior:'smooth'});}

/* ════ Ctrl+S ════ */
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){
    e.preventDefault();
    for(let i=0;i<7;i++) saveDay(toKey(addDays(WS,i)));
    saveMemo();
    toast('✅ 이번 주 전체 저장 완료 (Ctrl+S)');
  }
});

/* ════ 토스트 ════ */
let _t;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(_t);_t=setTimeout(()=>el.classList.remove('show'),2000);
}
function updSaved(){
  const n=new Date();
  document.getElementById('lastSaved').textContent=
    `저장 ${n.getHours().toString().padStart(2,'0')}:${n.getMinutes().toString().padStart(2,'0')}`;
}

render();
</script>
</body>
</html>

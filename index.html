<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>머니올라 주간 일정표</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#1a56db;
  --gray-100:#f3f4f6;
  --gray-200:#e5e7eb;
  --gray-600:#4b5563;
  --radius:5px;
  --row-alt:#eef4ff;
}

/* ── 공통 ── */
html{overflow-x:auto;}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:13px;color:#111;background:var(--gray-100);min-width:320px;}

/* ── STICKY TOP ── */
#stickyTop{position:sticky;top:0;z-index:500;box-shadow:0 2px 6px rgba(0,0,0,.18);}
header{background:var(--primary);color:#fff;padding:0 14px;height:50px;display:flex;align-items:center;justify-content:space-between;}
header h1{font-size:15px;font-weight:700;}
#lastSaved{font-size:10px;opacity:.8;white-space:nowrap;}
.week-nav{display:flex;align-items:center;gap:6px;background:#fff;padding:7px 14px;border-bottom:2px solid var(--primary);flex-wrap:wrap;}
.week-nav button{background:var(--primary);color:#fff;border:none;border-radius:var(--radius);padding:5px 10px;font-size:12px;cursor:pointer;}
.week-nav button:hover{opacity:.85;}
.btn-today{background:#10b981!important;}
.btn-save-top{background:#f59e0b!important;color:#fff!important;}
#weekTitle{font-size:13px;font-weight:700;min-width:160px;text-align:center;}
.nav-right{margin-left:auto;display:flex;gap:6px;}

/* ════════════════════════════════
   PC 테이블 레이아웃 (769px 이상)
════════════════════════════════ */
@media(min-width:769px){
  html{min-width:980px;}
  .card-view{display:none;}

  table{width:100%;border-collapse:collapse;min-width:960px;background:#fff;table-layout:fixed;}
  col.c-date  {width:100px;}
  col.c-slot  {width:126px;}
  col.c-guest {width:207px;}
  col.c-prod  {width:92px;}
  col.c-edit  {width:92px;}
  col.c-upload{width:231px;}
  col.c-res   {width:38px;}
  col.c-note  {width:132px;}
  col.c-act   {width:28px;}

  thead{position:sticky;top:92px;z-index:400;}
  thead th{
    background:var(--primary);color:#fff;
    padding:7px 5px;font-size:12px;font-weight:700;
    border-right:1px solid rgba(255,255,255,.25);
    white-space:nowrap;text-align:center;
  }
  tbody tr{border-bottom:1px solid var(--gray-200);}
  tbody tr.alt-row td{background:var(--row-alt);}
  tbody tr:hover td{background:#dbeafe!important;}
  td{padding:3px 4px;vertical-align:middle;border-right:1px solid var(--gray-200);overflow:hidden;}
  td.td-date{font-size:12px;font-weight:700;color:var(--primary);white-space:nowrap;vertical-align:top;padding-top:6px;}
  .today-row td.td-date{color:#dc2626;}
  .sat td.td-date{color:#2563eb;}
  .sun td.td-date{color:#dc2626;}
  .date-cell-inner{display:flex;flex-direction:column;gap:4px;align-items:flex-start;}
  .badge-today{display:inline-block;background:#dc2626;color:#fff;font-size:9px;padding:0 4px;border-radius:3px;margin-left:3px;vertical-align:middle;}
  .slot-label{font-size:10px;color:#6b7280;background:var(--gray-100);padding:1px 5px;border-radius:3px;display:inline-block;}
  .btn-add-slot{font-size:10px;background:#e0f2fe;color:#0369a1;border:1px solid #bae6fd;border-radius:3px;padding:2px 7px;cursor:pointer;white-space:nowrap;}
  .btn-add-slot:hover{background:#bae6fd;}
  table input[type=text],table textarea,table select{
    width:100%;border:1px solid var(--gray-200);border-radius:3px;
    font-size:12px;padding:3px 5px;font-family:inherit;background:#fff;display:block;
  }
  table input[type=text]:focus,table textarea:focus,table select:focus{outline:none;border-color:var(--primary);}
  table textarea{resize:none;overflow:hidden;min-height:24px;}
  table select{cursor:pointer;}
  tr.alt-row td input[type=text],
  tr.alt-row td textarea,
  tr.alt-row td select{background:var(--row-alt);}
  .res-cell{text-align:center;vertical-align:middle;}
  .res-cell input[type=checkbox]{width:15px;height:15px;cursor:pointer;}
  .btn-del{background:#ef4444;color:#fff;border:none;border-radius:3px;padding:2px 5px;font-size:10px;cursor:pointer;}
  #tableWrap{display:block;}
}

/* ════════════════════════════════
   모바일 카드 레이아웃 (768px 이하)
════════════════════════════════ */
@media(max-width:768px){
  #tableWrap{display:none;}

  .card-view{display:block;padding:8px;}

  .day-card{
    background:#fff;border-radius:10px;
    box-shadow:0 1px 4px rgba(0,0,0,.1);
    margin-bottom:10px;overflow:hidden;
  }
  .day-card.alt-card .card-body{background:var(--row-alt);}
  .day-card.alt-card select,
  .day-card.alt-card textarea,
  .day-card.alt-card input[type=text]{background:var(--row-alt)!important;}

  .card-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 12px;background:var(--primary);color:#fff;
    font-size:13px;font-weight:700;
  }
  .card-header.sat{background:#2563eb;}
  .card-header.sun{background:#dc2626;}
  .card-header.today{background:#dc2626;}
  .badge-today-card{background:#fff;color:#dc2626;font-size:9px;padding:1px 6px;border-radius:10px;font-weight:700;margin-left:6px;}
  .btn-add-slot-card{font-size:10px;background:rgba(255,255,255,.25);color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:3px;padding:2px 7px;cursor:pointer;}

  .card-body{padding:10px 12px;}

  .slot-block{border:1px solid var(--gray-200);border-radius:6px;padding:8px;margin-bottom:8px;background:#fff;}
  .day-card.alt-card .slot-block{background:var(--row-alt);}
  .slot-block-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .slot-num{font-size:10px;font-weight:700;color:var(--primary);background:var(--primary-light,#dbeafe);padding:1px 7px;border-radius:10px;}
  .btn-del-card{background:#ef4444;color:#fff;border:none;border-radius:3px;padding:2px 7px;font-size:10px;cursor:pointer;}

  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px;}
  .field-row.full{grid-template-columns:1fr;}
  .field-group{display:flex;flex-direction:column;gap:2px;}
  .field-label{font-size:10px;color:var(--gray-600);font-weight:600;}

  .card-view input[type=text],
  .card-view textarea,
  .card-view select{
    width:100%;border:1px solid var(--gray-200);border-radius:4px;
    font-size:12px;padding:5px 7px;font-family:inherit;background:#fff;display:block;
  }
  .card-view input[type=text]:focus,
  .card-view textarea:focus,
  .card-view select:focus{outline:none;border-color:var(--primary);}
  .card-view textarea{resize:none;overflow:hidden;min-height:32px;}
  .card-view select{cursor:pointer;}

  .res-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:12px;color:var(--gray-600);}
  .res-row input[type=checkbox]{width:16px;height:16px;cursor:pointer;}
}

/* ── 공통 메모 ── */
.memo-wrap{background:#fff;padding:14px 16px;margin-top:2px;border-top:2px solid var(--primary);}
.memo-wrap h3{font-size:14px;font-weight:700;color:var(--primary);margin-bottom:10px;}
.memo-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:10px;}
@media(max-width:768px){.memo-grid{grid-template-columns:1fr;}}
.memo-item label{display:block;font-size:12px;font-weight:700;color:var(--gray-600);margin-bottom:4px;}
.memo-item textarea{width:100%;height:68px;border:1px solid var(--gray-200);border-radius:var(--radius);font-family:inherit;font-size:12px;padding:5px 7px;resize:vertical;}
.memo-item textarea:focus{outline:none;border-color:var(--primary);}
.memo-btns{display:flex;gap:8px;flex-wrap:wrap;}
.btn-save{background:var(--primary);color:#fff;border:none;border-radius:var(--radius);padding:6px 16px;font-size:12px;cursor:pointer;}
.btn-save:hover{opacity:.85;}
.btn-clear{background:#e5e7eb;color:#374151;border:none;border-radius:var(--radius);padding:6px 16px;font-size:12px;cursor:pointer;}

/* ── 로딩 ── */
#loadingOverlay{position:fixed;inset:0;background:rgba(255,255,255,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9998;font-size:15px;color:var(--primary);font-weight:700;gap:12px;}
.spinner{width:36px;height:36px;border:4px solid var(--gray-200);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── 토스트 ── */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:8px 20px;border-radius:20px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:9999;white-space:nowrap;}
#toast.show{opacity:1;}
</style>
</head>

<div id="loadingOverlay">
  <div class="spinner"></div>
  <span>데이터 불러오는 중...</span>
</div>

  <header>
    <h1>📅 머니올라 근무 &amp; 녹화 일정표 2026</h1>

  </header>
  <div class="week-nav">
    <button onclick="changeWeek(-1)">◀ 이전</button>
    <div id="weekTitle"></div>
    <button onclick="changeWeek(1)">다음 ▶</button>
    <div class="nav-right">
      <button class="btn-today" onclick="goToday()">오늘</button>
      <button class="btn-save-top" onclick="saveAll()">💾 저장</button>
    </div>
  </div>
</div>

<!-- PC 테이블 -->
<div id="tableWrap">

      <col class="c-res"><col class="c-note"><col class="c-act">
    </colgroup>
    <thead>
      <tr>
        <th>촬영일</th><th>녹화시간</th><th>출연자</th>

        <th>리소스</th><th>특이사항</th><th></th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<!-- 모바일 카드 -->
<div class="card-view" id="cardView"></div>

<div class="memo-wrap">
  <h3>📝 주간 보고서 근태 및 특이사항</h3>
  <div class="memo-grid">
    <div class="memo-item"><label>양영은</label><textarea id="memo-yye" placeholder="양영은 근태 및 특이사항"></textarea></div>
    <div class="memo-item"><label>최건일</label><textarea id="memo-cgil" placeholder="최건일 근태 및 특이사항"></textarea></div>
    <div class="memo-item"><label>특이사항</label><textarea id="memo-etc" placeholder="기타 특이사항"></textarea></div>
  </div>
  <div class="memo-btns">
    <button class="btn-save" onclick="saveMemo()">메모 저장</button>
    <button class="btn-clear" onclick="clearWeekData()">이번 주 초기화</button>
  </div>
</div>

<div id="toast"></div>

/* ── Cloud ── */
let cloudSched={};
let cloudMemos={};

async function fetchCloud(){
  try{
    const[sr,mr]=await Promise.all([
      fetch(API+'?type=sched').then(r=>r.json()),
      fetch(API+'?type=memo').then(r=>r.json())
    ]);
    cloudSched=sr||{};
    cloudMemos=mr||{};
  }catch(e){cloudSched={};cloudMemos={};}
}
async function saveSchedCloud(o){
  cloudSched=o;
  try{await fetch(API,{method:'POST',body:JSON.stringify({type:'sched',data:o})});}catch(e){}
}
async function saveMemoCloud(o){
  cloudMemos=o;
  try{await fetch(API,{method:'POST',body:JSON.stringify({type:'memo',data:o})});}catch(e){}
}

/* ── Utils ── */
function toKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(d,n){const r=new Date(d.getFullYear(),d.getMonth(),d.getDate());r.setDate(r.getDate()+n);return r;}
function getMon(d){const r=new Date(d.getFullYear(),d.getMonth(),d.getDate());const dw=r.getDay();r.setDate(r.getDate()+(dw===0?-6:1-dw));return r;}
const DAY_KO=['일','월','화','수','목','금','토'];
function fmt(d){return `${d.getMonth()+1}월 ${d.getDate()}일 (${DAY_KO[d.getDay()]})`;}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function autoH(ta){if(!ta)return;ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';}
function isMobile(){return window.innerWidth<=768;}

let weekStart=getMon(new Date());
const todayKey=toKey(new Date());

function getSlots(key){
  if(cloudSched[key])return JSON.parse(JSON.stringify(cloudSched[key]));
  if(P[key])return JSON.parse(JSON.stringify(P[key]));
  return [{slot:'',guest:'',prod:'',edit:'',upload:'',res:false,note:''}];
}

function timeOpts(v){return TIMES.map(t=>`<option value="${esc(t)}"${t===v?' selected':''}>${t||'-- 시간 --'}</option>`).join('');}
function prodOpts(v){return PRODUCERS.map(p=>`<option value="${esc(p)}"${p===v?' selected':''}>${p||'-- 제작자 --'}</option>`).join('');}
function editOpts(v){return EDITORS.map(e=>`<option value="${esc(e)}"${e===v?' selected':''}>${e||'-- 편집자 --'}</option>`).join('');}

/* ══════════════════════════════
   PC 테이블 렌더링
══════════════════════════════ */
function slotRowHTML(key,idx,s,isFirst,label,dow){
  const isToday=(key===todayKey);
  const isAlt=(dow===1||dow===3||dow===5||dow===0);
  let cls=isAlt?'alt-row':'';
  if(isToday)cls+=' today-row';
  if(dow===6)cls+=' sat';
  if(dow===0)cls+=' sun';
  const dateTd=isFirst
    ?`<td class="td-date"><div class="date-cell-inner"><span>${esc(label)}${isToday?'<span class="badge-today">오늘</span>':''}</span><button class="btn-add-slot" onclick="addSlot('${key}')">＋ 2차 녹화</button></div></td>`
    :`<td><span class="slot-label">2차</span></td>`;
  return `<tr class="${cls.trim()}" data-key="${key}" data-idx="${idx}">
    ${dateTd}
    <td><select class="f-slot">${timeOpts(s.slot)}</select></td>
    <td><textarea class="f-guest" oninput="autoH(this)">${esc(s.guest)}</textarea></td>
    <td><select class="f-prod">${prodOpts(s.prod)}</select></td>
    <td><select class="f-edit">${editOpts(s.edit)}</select></td>
    <td><textarea class="f-upload" oninput="autoH(this)">${esc(s.upload)}</textarea></td>
    <td class="res-cell"><input type="checkbox" class="f-res"${s.res?' checked':''}></td>
    <td><textarea class="f-note" oninput="autoH(this)">${esc(s.note)}</textarea></td>
    <td>${!isFirst?`<button class="btn-del" onclick="delSlot('${key}',${idx})">✕</button>`:'&nbsp;'}</td>
  </tr>`;
}

function renderTable(){
  const tb=document.getElementById('tableBody');
  const ws=weekStart,we=addDays(ws,6);
  document.getElementById('weekTitle').textContent=`${ws.getMonth()+1}월 ${ws.getDate()}일 ~ ${we.getMonth()+1}월 ${we.getDate()}일`;
  let html='';
  for(let i=0;i<7;i++){
    const d=addDays(ws,i);
    const key=toKey(d),dow=d.getDay(),label=fmt(d);
    getSlots(key).forEach((s,idx)=>{html+=slotRowHTML(key,idx,s,idx===0,label,dow);});
  }
  tb.innerHTML=html;
  tb.querySelectorAll('textarea').forEach(ta=>autoH(ta));
  const sH=document.getElementById('stickyTop').offsetHeight;
  document.querySelector('thead').style.top=sH+'px';
}

/* ══════════════════════════════
   모바일 카드 렌더링
══════════════════════════════ */
function slotBlockHTML(key,idx,s,isFirst){
  const delBtn=!isFirst?`<button class="btn-del-card" onclick="delSlot('${key}',${idx})">✕ 삭제</button>`:'';
  return `<div class="slot-block" data-key="${key}" data-idx="${idx}">
    <div class="slot-block-header">
      <span class="slot-num">${isFirst?'1차 녹화':'2차 녹화'}</span>
      ${delBtn}
    </div>
    <div class="field-row">
      <div class="field-group"><span class="field-label">녹화시간</span><select class="f-slot">${timeOpts(s.slot)}</select></div>
      <div class="field-group"><span class="field-label">리소스 신청</span><div class="res-row"><input type="checkbox" class="f-res"${s.res?' checked':''}><span>리소스 신청</span></div></div>
    </div>
    <div class="field-row full">
      <div class="field-group"><span class="field-label">출연자</span><textarea class="f-guest" oninput="autoH(this)">${esc(s.guest)}</textarea></div>
    </div>
    <div class="field-row">
      <div class="field-group"><span class="field-label">제작자</span><select class="f-prod">${prodOpts(s.prod)}</select></div>
      <div class="field-group"><span class="field-label">편집자</span><select class="f-edit">${editOpts(s.edit)}</select></div>
    </div>
    <div class="field-row full">
      <div class="field-group"><span class="field-label">업로드 아이템</span><textarea class="f-upload" oninput="autoH(this)">${esc(s.upload)}</textarea></div>
    </div>
    <div class="field-row full">
      <div class="field-group"><span class="field-label">특이사항</span><textarea class="f-note" oninput="autoH(this)">${esc(s.note)}</textarea></div>
    </div>
  </div>`;
}

function dayCardHTML(key,label,dow,slots){
  const isToday=(key===todayKey);
  const isAlt=(dow===1||dow===3||dow===5||dow===0);
  let hCls='card-header';
  if(isToday)hCls+=' today';
  else if(dow===6)hCls+=' sat';
  else if(dow===0)hCls+=' sun';
  let cardCls='day-card';
  if(isAlt)cardCls+=' alt-card';
  const slotsHTML=slots.map((s,idx)=>slotBlockHTML(key,idx,s,idx===0)).join('');
  return `<div class="${cardCls}" data-card="${key}">
    <div class="${hCls}">
      <span>${esc(label)}${isToday?'<span class="badge-today-card">오늘</span>':''}</span>
      <button class="btn-add-slot-card" onclick="addSlot('${key}')">＋ 2차 녹화</button>
    </div>
    <div class="card-body">${slotsHTML}</div>
  </div>`;
}

function renderCards(){
  const cv=document.getElementById('cardView');
  const ws=weekStart,we=addDays(ws,6);
  document.getElementById('weekTitle').textContent=`${ws.getMonth()+1}월 ${ws.getDate()}일 ~ ${we.getMonth()+1}월 ${we.getDate()}일`;
  let html='';
  for(let i=0;i<7;i++){
    const d=addDays(ws,i);
    const key=toKey(d),dow=d.getDay(),label=fmt(d);
    html+=dayCardHTML(key,label,dow,getSlots(key));
  }
  cv.innerHTML=html;
  cv.querySelectorAll('textarea').forEach(ta=>autoH(ta));
}

/* ── 통합 render ── */
function render(){
  if(isMobile()) renderCards();
  else renderTable();
  loadMemoUI();
}

window.addEventListener('resize',()=>render());

/* ── Add/Del slot ── */
function addSlot(key){
  const slots=getSlots(key);
  if(slots.length>=2){toast('2차 녹화까지만 추가 가능합니다');return;}
  slots.push({slot:'',guest:'',prod:'',edit:'',upload:'',res:false,note:''});
  cloudSched[key]=slots;render();
}
function delSlot(key,idx){
  const slots=getSlots(key);
  if(slots.length<=1)return;
  slots.splice(idx,1);
  cloudSched[key]=slots;render();
}

/* ── Collect ── */
function collectDay(key){
  const sel=isMobile()
    ?document.querySelectorAll(`.slot-block[data-key="${key}"]`)
    :document.querySelectorAll(`tr[data-key="${key}"]`);
  const slots=[];
  sel.forEach(el=>{
    slots.push({
      slot:  el.querySelector('.f-slot').value,
      guest: el.querySelector('.f-guest').value,
      prod:  el.querySelector('.f-prod').value,
      edit:  el.querySelector('.f-edit').value,
      upload:el.querySelector('.f-upload').value,
      res:   el.querySelector('.f-res').checked,
      note:  el.querySelector('.f-note').value,
    });
  });
  return slots;
}

async function saveAll(){
  const btn=document.querySelector('.btn-save-top');
  btn.textContent='저장 중...';btn.disabled=true;
  for(let i=0;i<7;i++){
    const key=toKey(addDays(weekStart,i));
    cloudSched[key]=collectDay(key);
  }
  await saveSchedCloud(cloudSched);
  await saveMemoFromUI();
  const ts=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('lastSaved').textContent='저장: '+ts;
  btn.textContent='💾 저장';btn.disabled=false;
  toast('💾 저장되었습니다');
}

async function clearWeekData(){
  if(!confirm('이번 주 데이터를 원본으로 초기화할까요?'))return;
  for(let i=0;i<7;i++) delete cloudSched[toKey(addDays(weekStart,i))];
  await saveSchedCloud(cloudSched);
  render();toast('초기화되었습니다');
}

/* ── Memo ── */
function loadMemoUI(){
  const wk=toKey(weekStart),d=cloudMemos[wk]||{};
  document.getElementById('memo-yye').value=d.yye||'';
  document.getElementById('memo-cgil').value=d.cgil||'';
  document.getElementById('memo-etc').value=d.etc||'';
}
async function saveMemoFromUI(){
  const wk=toKey(weekStart);
  cloudMemos[wk]={yye:document.getElementById('memo-yye').value,cgil:document.getElementById('memo-cgil').value,etc:document.getElementById('memo-etc').value};
  await saveMemoCloud(cloudMemos);
}
async function saveMemo(){await saveMemoFromUI();toast('메모 저장됨');}

/* ── Nav ── */
function changeWeek(dir){weekStart=addDays(weekStart,dir*7);render();}
function goToday(){weekStart=getMon(new Date());render();}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();saveAll();}});

/* ── Toast ── */
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200);}

/* ── Init ── */
(async()=>{
  await fetchCloud();
  document.getElementById('loadingOverlay').style.display='none';
  render();
})();
</script>
</body>
</html>
